---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build & Publish Container

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  release:
    name: Release
    permissions:
      contents: read
      id-token: write # cosign keyless signing
      packages: write
    # Docker's official reusable builder: multi-arch (native runners, no QEMU),
    # SBOM attestation and cosign signing handled for us.
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    with:
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=semver,pattern={{version}}
        type=raw,value=rolling,enable=${{ github.event_name == 'release' }}
        type=ref,event=branch
      build-args: |
        GIT_SHA=${{ github.sha }}
        GIT_REF=${{ github.ref_name }}
      output: image
      platforms: linux/amd64,linux/arm64
      # The builder still defaults to 24.04; its own prepare/finalize jobs stay
      # on 24.04 until docker/github-builder moves them.
      runner: |
        default=ubuntu-26.04
        linux/arm=ubuntu-26.04-arm
        linux/arm64=ubuntu-26.04-arm
      # Pull requests only build, so broken dependency bumps fail before merge.
      push: ${{ github.event_name != 'pull_request' }}
      sbom: true
      # auto signs whenever the image is pushed; `true` errors without a push.
      sign: auto
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
